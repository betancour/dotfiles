# Window chrome and layout.
# Position is intentionally omitted so the window manager places the window
# (portable across displays and machines).

# Window chrome and layout.
# Tuned for 13.6" M2 Air (1470×956) with left widgets + a large browser.

[window]
dimensions = { columns = 125, lines = 44 }
padding = { x = 18, y = 14 }
dynamic_padding = true
decorations = "Buttonless"
opacity = 1.0
blur = false
startup_mode = "Windowed"
dynamic_title = true
option_as_alt = "Both"
resize_increments = true

# Move left vs the last values. Lower x if it is still right of Firefox.
position = { x = 310, y = 93 }
