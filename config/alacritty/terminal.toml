# Terminal runtime: environment, shell, scrollback, cursor, selection, mouse.
#
# Shell intentionally uses a plain login shell. Start tmux/zellij from the
# shell (or a desktop launcher with -e), so Alacritty stays usable when a
# multiplexer is missing and nested sessions are avoided.
#
# Power notes (macOS Apple Silicon):
# - Do NOT force renderer = "gles2" — it crashes with
#   GL_EXT_blend_func_extended not supported (dual-source blending).
# - prefer_egl is for Linux/BSD; leave it off on macOS (uses CGL).
# - Window chrome (opacity/blur/decorations) lives in window.toml.

[env]
# Prefer Alacritty's native terminfo when present (checked via `infocmp alacritty`).
# Uncomment for hosts that only know xterm-256color:
# TERM = "xterm-256color"
COLORTERM = "truecolor"

[terminal]
osc52 = "OnlyCopy"

[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

[scrolling]
history = 5000
multiplier = 3

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true
thickness = 0.15

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[mouse]
hide_when_typing = true

[bell]
# duration = 0 disables the visual bell (animation alone is not enough)
animation = "Linear"
duration = 0

[debug]
# Default renderer ("None") picks the best backend. On this Mac that is
# desktop GL via CGL; forced gles2 fails at shader compile time.
# renderer = "gles2pure"  # optional lower-power path if default is too heavy
render_timer = false
persistent_logging = false
log_level = "Warn"
