# Starship — Green Phosphor (hex = Neovim tokens)

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold #00FF66)"
error_symbol = "[❯](bold bg:#FF3B3B fg:#000000)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold #B5FFCE"

[git_branch]
symbol = ""
style = "#1BE5EE"
format = "([$symbol$branch]($style) )"

[git_status]
style = "#F9D544"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
ignore_submodules = true
conflicted = "⇕"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "●"
staged = "+"
renamed = "»"
deleted = "✘"

[username]
style_user = "#00FF66"
format = "[$user]($style)@"
show_always = false

[hostname]
ssh_only = true
format = "[$hostname](bold #5DEBBC) "
disabled = false

[cmd_duration]
min_time = 2000
format = "took [$duration](#F9D544) "
