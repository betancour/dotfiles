# Starship prompt — Green Phosphor (green / reverse only).
# Linked to ~/.config/starship.toml by the installer when present.

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
# 500ms (Starship default) is too tight for Apple Git on first prompt.
command_timeout = 1000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold bg:green fg:black)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold green"

[git_branch]
symbol = ""
style = "green"
format = "([$symbol$branch]($style) )"

[git_status]
style = "green"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
ignore_submodules = true
conflicted = "⇕"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "●"
staged = "+"
renamed = "»"
deleted = "✘"

[username]
style_user = "green"
format = "[$user]($style)@"
show_always = false

[hostname]
ssh_only = true
format = "[$hostname](bold green) "
disabled = false

[cmd_duration]
min_time = 2000
format = "took [$duration](green) "
