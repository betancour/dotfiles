# Starship — Tokyo Night

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 1000

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold #7aa2f7"

[git_branch]
symbol = ""
format = "([$symbol$branch]($style) )"
style = "#bb9af7"

[git_status]
format = "([\\[$all_status$ahead_behind\\]]($style) )"
ignore_submodules = true
style = "#e0af68"
conflicted = "⇕"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "●"
staged = "+"
renamed = "»"
deleted = "✘"

[username]
format = "[$user]($style)@"
show_always = false
style_user = "#7dcfff"

[hostname]
ssh_only = true
format = "[$hostname] "
disabled = false
style = "#bb9af7"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "#e0af68"
