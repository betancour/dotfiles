# Green Phosphor — eza listing theme
# Hex values copied from Neovim colors/green-phosphor.lua so ls matches syntax.
#
#   ident / files     #00FF66
#   keyword / folders #B5FFCE
#   func / exec       #1BE5EE
#   param / symlink   #5DEBBC
#   string / image    #C8F23C
#   const / video     #F9D544
#   type / document   #B2E2E4
#   comment / dim     #6FA783
#   punct             #438C60
#   error / archive   #FF3B3B

colourful: true

filekinds:
  normal: { foreground: "#00FF66" }
  directory: { foreground: "#B5FFCE", is_bold: true }
  symlink: { foreground: "#5DEBBC", is_underline: true }
  pipe: { foreground: "#F9D544" }
  block_device: { foreground: "#F9D544", is_bold: true }
  char_device: { foreground: "#F9D544", is_bold: true }
  socket: { foreground: "#FF3B3B", is_bold: true }
  special: { foreground: "#F9D544" }
  executable: { foreground: "#1BE5EE", is_bold: true }
  mount_point: { foreground: "#B5FFCE", is_bold: true, is_underline: true }

perms:
  user_read: { foreground: "#6FA783" }
  user_write: { foreground: "#00FF66" }
  user_execute_file: { foreground: "#1BE5EE", is_bold: true }
  user_execute_other: { foreground: "#1BE5EE", is_bold: true }
  group_read: { foreground: "#6FA783" }
  group_write: { foreground: "#00FF66" }
  group_execute: { foreground: "#1BE5EE" }
  other_read: { foreground: "#6FA783" }
  other_write: { foreground: "#00FF66" }
  other_execute: { foreground: "#1BE5EE" }
  special_user_file: { foreground: "#FF3B3B" }
  special_other: { foreground: "#FF3B3B" }
  attribute: { foreground: "#6FA783" }

size:
  major: { foreground: "#00FF66", is_bold: true }
  minor: { foreground: "#6FA783" }
  number_byte: { foreground: "#6FA783" }
  number_kilo: { foreground: "#00FF66" }
  number_mega: { foreground: "#F9D544" }
  number_giga: { foreground: "#FF3B3B" }
  number_huge: { foreground: "#1BE5EE" }
  unit_byte: { foreground: "#6FA783" }
  unit_kilo: { foreground: "#00FF66" }
  unit_mega: { foreground: "#F9D544" }
  unit_giga: { foreground: "#FF3B3B" }
  unit_huge: { foreground: "#1BE5EE" }

users:
  user_you: { foreground: "#00FF66", is_bold: true }
  user_root: { foreground: "#000000", background: "#FF3B3B" }
  user_other: { foreground: "#6FA783" }
  group_yours: { foreground: "#00FF66" }
  group_other: { foreground: "#6FA783" }
  group_root: { foreground: "#000000", background: "#FF3B3B" }

links:
  normal: { foreground: "#5DEBBC" }
  multi_link_file: { foreground: "#000000", background: "#F9D544" }

git:
  new: { foreground: "#00FF66", is_bold: true }
  modified: { foreground: "#F9D544" }
  deleted: { foreground: "#FF3B3B" }
  renamed: { foreground: "#5DEBBC" }
  typechange: { foreground: "#1BE5EE" }
  ignored: { foreground: "#6FA783", is_dimmed: true }
  conflicted: { foreground: "#FF3B3B", is_bold: true }

git_repo:
  branch_main: { foreground: "#00FF66", is_bold: true }
  branch_other: { foreground: "#F9D544" }
  git_clean: { foreground: "#00FF66" }
  git_dirty: { foreground: "#F9D544", is_bold: true }

file_type:
  image: { foreground: "#C8F23C" }
  video: { foreground: "#F9D544", is_bold: true }
  music: { foreground: "#5DEBBC" }
  lossless: { foreground: "#5DEBBC", is_bold: true }
  crypto: { foreground: "#1BE5EE", is_bold: true }
  document: { foreground: "#B2E2E4" }
  compressed: { foreground: "#FF3B3B" }
  temp: { foreground: "#6FA783", is_dimmed: true }
  compiled: { foreground: "#94C5A4" }
  build: { foreground: "#F9D544", is_bold: true, is_underline: true }
  source: { foreground: "#1BE5EE", is_bold: true }

punctuation: { foreground: "#438C60" }
date: { foreground: "#6FA783" }
inode: { foreground: "#438C60" }
blocks: { foreground: "#438C60" }
header: { foreground: "#B5FFCE", is_bold: true }
octal: { foreground: "#6FA783" }
flags: { foreground: "#00FF66" }

symlink_path: { foreground: "#5DEBBC" }
control_char: { foreground: "#FF3B3B" }
broken_symlink: { foreground: "#FF3B3B" }
broken_path_overlay: { foreground: "#FF3B3B", is_underline: true }
